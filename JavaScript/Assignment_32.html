<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = prompt("Enter your percentage");
        if(a>=90){
            document.write("1st")
        }
        else if(60<a<90){
            document.write("2st")
        }
        else if(30<a<60){
            document.write("3st")
        }
        else if(0<a<30){
            document.write("4st")
        }
        
    </script>
</body>
</html>
